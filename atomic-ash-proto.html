<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atomic Ash · Prototipo isométrico</title>
<style>
:root{--bg:#14120d;--panel:#2a261c;--ink:#efe6cf;--dim:#a39a82;--accent:#e8a33a;--common:#bdb6a2;--rare:#5fb0ff;--epic:#c77dff;--weapon:#8fd17a;--danger:#e0533c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,9,6,.8);z-index:10;padding:12px;overflow:auto}
.ov.on{display:flex}
.box{background:var(--panel);border:2px solid #4a4332;border-radius:10px;padding:14px;max-width:920px;width:100%;max-height:100%;overflow:auto}
h1{font-size:22px;letter-spacing:3px;color:var(--accent)}
h2{font-size:16px;margin-bottom:10px;letter-spacing:1px}
p.hint{font-size:12px;color:var(--dim);margin:6px 0 10px}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{flex:1 1 190px;max-width:270px;background:#1e1b14;border:2px solid var(--common);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.card:hover{filter:brightness(1.25)}
.card .tag{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--dim)}
.card .t{font-weight:700;margin:3px 0;font-size:15px}
.card .d{font-size:12px;color:var(--dim);line-height:1.35}
.card.rare{border-color:var(--rare)}.card.rare .tag{color:var(--rare)}
.card.epic{border-color:var(--epic)}.card.epic .tag{color:var(--epic)}
.card.weapon{border-color:var(--weapon)}.card.weapon .tag{color:var(--weapon)}
.card.fusion{border-color:var(--accent);box-shadow:0 0 14px rgba(232,163,58,.6)}.card.fusion .tag{color:var(--accent)}
.card.locked{opacity:.35;cursor:default}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;align-items:center}
button.b{background:#3b3526;color:var(--ink);border:1px solid #5a523d;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
button.b:disabled{opacity:.35;cursor:default}
#cons{position:fixed;right:10px;bottom:10px;display:none;gap:6px;z-index:5}
#cons.on{display:flex}
#cons button{width:58px;height:54px;border-radius:10px;background:rgba(42,38,28,.85);border:1px solid #5a523d;color:var(--ink);font:600 10px system-ui;line-height:1.25;cursor:pointer}
#cons button b{font-size:15px;display:block}
#topBtns{position:fixed;top:8px;right:8px;z-index:7;display:none;gap:6px}
#topBtns.on{display:flex}
#topBtns button{background:rgba(42,38,28,.85);color:var(--ink);border:1px solid #5a523d;border-radius:6px;padding:5px 9px;font:600 12px system-ui;cursor:pointer}
#dbg{position:fixed;top:42px;right:8px;width:310px;max-height:calc(100% - 52px);overflow:auto;background:rgba(18,16,11,.94);border:1px solid #5a523d;border-radius:8px;padding:8px;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;z-index:7;display:none}
#dbg.on{display:block}
#dbg pre{white-space:pre-wrap;margin-bottom:6px}
#dbg .g{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
#dbg button{background:#3b3526;color:var(--ink);border:1px solid #5a523d;border-radius:4px;padding:3px 6px;font:11px ui-monospace,monospace;cursor:pointer}
#dbg button.on{background:#6b5a24}
#rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--bg);font-size:18px;text-align:center;padding:20px}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
.ticket{max-width:340px;background:#e9dfc4;color:#2a2418;font-family:ui-monospace,Menlo,Consolas,monospace;border-radius:4px;padding:16px}
.ticket h2{text-align:center;border-bottom:1px dashed #2a2418;padding-bottom:6px}
.ticket .l{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-size:13px}.ticket .l span:last-child{text-align:right}
.ticket .tot{border-top:1px dashed #2a2418;margin-top:8px;padding-top:6px;font-weight:700;font-size:15px}
.ticket button.b{background:#2a2418;color:#e9dfc4}
.assets{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ov" class="ov"></div>
<div id="cons"></div>
<div id="topBtns"><button id="bPause">II</button><button id="bDbg">F3</button></div>
<div id="dbg"></div>
<div id="rotate">Gira el móvil a horizontal ↻</div>
<input type="file" id="assetPicker" webkitdirectory directory multiple style="display:none">

// =====================================================================
// LÓGICA — sin DOM. Estado + tick(dt). Coordenadas de mundo (cenitales).

const TAU = Math.PI * 2;

(function initConfig() {

})();
function xpFor(n) { const X = CONFIG.xp; return X.a + X.b * (n - 1) + Math.floor(X.c * Math.pow(n - 1, 1.5)); }

function mkWeapon(id) { return { id, lvl: 1, cd: 0.3, a: 0, r: 0 }; }

function createGame(charId, seed) {
  const C = CONFIG, ch = C.characters[charId];
  if (seed === undefined || seed === null) seed = (Math.random() * 2147483647) | 0;
  const M = C.run.mapSize;
  const s = {
    seed, rng: mulberry32(seed), t: 0, charId, over: false, won: false, paused: false,
    choice: null, pendingLevels: 0, rerolls: C.player.rerolls, nextId: 1,
    p: { x: M / 2, y: M / 2, r: C.player.radius, hp: ch.hp, maxHp: ch.hp, fx: 0.7, fy: 0.7, inv: 0, rad: 0, radPeak: 0, radIdle: 99, turbo: 0, healBudget: 0, god: false, hurt: 0, moving: false, lastHit: -9, deadAt: -1 },
    tr: {}, traitPicks: {}, levelHistory: [], item: null, weapons: [mkWeapon(ch.weapon)], cons: Object.assign({}, C.player.startCons),
    enemies: [], shots: [], ebullets: [], pools: [], lobs: [], pickups: [], hazards: [], slimes: [], tele: [], beams: [], booms: [], mines: [], corpses: [], texts: [], banners: [],
    xp: 0, level: 1, xpNext: xpFor(1), kills: 0, dmgTotal: 0, dmgBy: {}, dpsB: {}, bosses: 0,

function recalc(s) {
  const C = CONFIG, p = s.p, ch = C.characters[s.charId], tr = s.tr, it = s.item ? C.items[s.item] : {};

  st.dmgMult = dmg;

  st.xpMult = 1 + (tr.xp || 0) / 100;
  st.red = Math.min(C.caps.dmgReduction, (tr.red || 0) / 100);
  st.dodge = Math.min(C.caps.dodge, (tr.dodge || 0) / 100);
  st.crit = Math.min(C.caps.crit, (tr.crit || 0) / 100);

  p.maxHp = st.maxHp;

}

// ---------- utilidades ----------
function banner(s, text) { s.banners.push({ text, life: 2.6 }); }
function textFx(s, x, y, txt, col, size) { if (s.texts.length < 120) s.texts.push({ x, y, txt, col, life: 0.8, size: size || 14 }); }
function heal(s, a) { const p = s.p; p.hp = Math.min(p.maxHp, p.hp + a); }

// Sprite que corresponde a un enemigo según su fase (variantes de la biblia de arte)
function spriteIdFor(e) {
  const d = CONFIG.enemies[e.type];
  if (!d.variants) return e.type;
  let id = e.type;
  for (const v of d.variants) {
    if (v.below !== undefined && e.hp / e.maxHp < v.below) id = v.id;
    if (v.phase !== undefined && e.phase >= v.phase) id = v.id;
  }
  return id;
}

function buildGrid(s) {
  const g = s.grid, cs = CONFIG.gridCell; g.clear();
  for (const e of s.enemies) { if (e.dead) continue; const k = Math.floor(e.x / cs) * 4096 + Math.floor(e.y / cs); let a = g.get(k); if (!a) { a = []; g.set(k, a); } a.push(e); }
}

// ---------- enemigos ----------
function spawnEnemy(s, type, x, y, opts) {

}

function dropGems(s, x, y, value) {
  const G = CONFIG.xp.gems;
  let v = Math.round(value);
  let gems = 0; for (const k of s.pickups) if (k.kind === 'gem') gems++;
  for (const g of G) {
    while (v >= g) {
      v -= g;

        const pool = s.pickups.filter(k => k.kind === 'gem' && !k.dead);
        if (pool.length) { pool[(s.rng() * pool.length) | 0].val += g; continue; }
      }
      s.pickups.push({ kind: 'gem', val: g, x: x + (s.rng() - 0.5) * 18, y: y + (s.rng() - 0.5) * 18, r: g >= 25 ? 7 : g >= 5 ? 5 : 3.5, pull: false, sp: 0 });
      gems++;
    }
  }
}

function killEnemy(s, e, src) {
  if (e.dead) return;
  e.dead = true; s.kills++;
  const C = CONFIG, d = C.enemies[e.type];
  // cadáver para la animación de muerte (lo consume el render)

  if (xp > 0) dropGems(s, e.x, e.y, xp);
  if (e.boss) {
    s.bosses++;
    if (e.type === 'rey_rata' || e.type === 'dirigible') { s.pickups.push({ kind: 'chest', x: clamp(e.x, 40, C.run.mapSize - 40), y: clamp(e.y, 40, C.run.mapSize - 40), r: 14 }); banner(s, '¡Cofre de objeto!'); }

  }

}

function hurtPlayer(s, raw, o) {

  if (p.inv > 0 || p.god) return 0;

function updateEnemies(s, dt) {
  const C = CONFIG, p = s.p, M = C.run.mapSize, kd = Math.exp(-C.knockback.decay * dt);
  for (const e of s.enemies) {
    if (e.dead) continue;
    const d0 = C.enemies[e.type];
    e.flash -= dt; e.atkCd -= dt;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    let vx = 0, vy = 0; const spd = e.spd;
    switch (d0.ai) {
      case 'gunner':
        if (d > d0.keepMax) { vx = ux * spd; vy = uy * spd; }
        else if (d < d0.keepMin) { vx = -ux * spd; vy = -uy * spd; }
        else { vx = -uy * spd * 0.4 * e.side; vy = ux * spd * 0.4 * e.side; }

        if (e.timer <= 0 && d < 700) { e.timer = d0.fireCd; fireBullet(s, e.x, e.y, ux, uy, d0.bulletSpd, e.dmg, e.irr ? C.irradiated.rad : 0); markAttack(s, e); }

        else if (e.timer <= 0 && d < d0.range) {
          e.timer = d0.every; e.burst = d0.burst; e.bt = 0; markAttack(s, e);
          if (s.rng() < 0.3) textFx(s, e.x, e.y, C.slogans[(s.rng() * C.slogans.length) | 0], '#d6b0ff', 12);
        }
        e.fx = ux; e.fy = uy;
        break;
      case 'slug':

        vx = tx * spd + ux * clamp(err * 1.5, -spd, spd);
        vy = ty * spd + uy * clamp(err * 1.5, -spd, spd);
        const p2 = e.hp / e.maxHp < d0.p2;
        if (p2 && e.phase === 1) { e.phase = 2; banner(s, 'El dirigible pierde altura'); }
        e.timer -= dt;
        if (e.timer <= 0) {
          e.timer = p2 ? d0.everyP2 : d0.every;
          if (!e.alt) {
            markAttack(s, e, 'attack_1');
            for (let i = 0; i < d0.paraCount; i++) {
              const a = s.rng() * TAU, rr = d0.paraMin + s.rng() * (d0.paraMax - d0.paraMin);
              s.tele.push({ x: clamp(p.x + Math.cos(a) * rr, 30, M - 30), y: clamp(p.y + Math.sin(a) * rr, 30, M - 30), r: d0.paraR, t: 0, dur: d0.paraWarn, dmg: d0.paraDmg, spawn: 'torreta' });
            }
          } else {
            markAttack(s, e, 'attack_2');

            for (let i = 0; i < d0.bombCount; i++) {
              const off = (i - (d0.bombCount - 1) / 2) * d0.bombSpacing;
              s.tele.push({ x: clamp(p.x + bx * off, 0, M), y: clamp(p.y + by * off, 0, M), r: d0.bombR, t: 0, dur: d0.bombWarn, dmg: d0.bombDmg });
            }
            if (p2) for (let i = 0; i < d0.p2Summon; i++) { const a = i / d0.p2Summon * TAU; spawnEnemy(s, d0.p2SummonType, clamp(p.x + Math.cos(a) * 340, 10, M - 10), clamp(p.y + Math.sin(a) * 340, 10, M - 10), { irr: false }); }
          }
          e.alt = !e.alt;
        }
        break;
      }
      case 'coloso': {
        const f = e.hp / e.maxHp;
        const ph = f > 0.66 ? 1 : f > 0.33 ? 2 : 3;
        if (ph !== e.phase) { e.phase = ph; banner(s, 'El Coloso: fase ' + ph); }
        const sp = spd * (ph === 3 ? d0.spdP3 : 1);
        if (e.stun > 0) e.stun -= dt; else { vx = ux * sp; vy = uy * sp; }
        e.timer -= dt;
        if (e.timer <= 0) {
          e.timer = ph === 3 ? d0.everyP3 : d0.every;
          const rot = ph >= 2 ? ['stomp', 'debris', 'summon'] : ['stomp', 'debris'];
          const act = rot[e.act++ % rot.length];
          if (act === 'stomp') { markAttack(s, e, 'attack_1'); s.tele.push({ x: e.x, y: e.y, r: d0.stompR, t: 0, dur: d0.stompWarn, dmg: d0.stompDmg }); e.stun = d0.stompWarn; }
          else if (act === 'debris') {
            markAttack(s, e, 'attack_2');
            const n = d0.debrisBase + d0.debrisPerPhase * ph;
            for (let i = 0; i < n; i++) {
              const a = s.rng() * TAU, rr = i === 0 ? 0 : 40 + s.rng() * 180;
              s.tele.push({ x: clamp(p.x + Math.cos(a) * rr, 0, M), y: clamp(p.y + Math.sin(a) * rr, 0, M), r: d0.debrisR, t: 0, dur: d0.debrisWarn, dmg: d0.debrisDmg });
            }
          } else {
            markAttack(s, e, 'attack_2');
            spawnEnemy(s, 'torreta', clamp(e.x + 110, 20, M - 20), clamp(e.y, 20, M - 20), { irr: false });
            for (let i = 0; i < d0.summonGhouls; i++) { const a = i / d0.summonGhouls * TAU; spawnEnemy(s, 'necrofago', clamp(e.x + Math.cos(a) * 120, 10, M - 10), clamp(e.y + Math.sin(a) * 120, 10, M - 10), { irr: false }); }
          }
        }
        break;
      }
      default:
        vx = ux * spd; vy = uy * spd;
    }
    // separación (no aplica a jefes, voladores ni estáticos)
    if (!e.boss && !e.flying && d0.ai !== 'turret') {
      for (const o of queryNear(s, e.x, e.y, e.r)) {
        if (o === e || o.flying) continue;
        let ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy);
        const ov = e.r + o.r - od;
        if (ov > 0) {
          if (od < 0.01) { ox = s.rng() - 0.5; oy = s.rng() - 0.5; od = Math.hypot(ox, oy); }
          const push = Math.min(ov, 6) * (o.boss ? 1 : 0.5);
          e.x += ox / od * push; e.y += oy / od * push;
        }
      }
    }
    const mvx = vx + e.kbx, mvy = vy + e.kby;
    e.x = clamp(e.x + mvx * dt, e.r, M - e.r);
    e.y = clamp(e.y + mvy * dt, e.r, M - e.r);
    e.kbx *= kd; e.kby *= kd;
    // orientación para el sprite
    const vl = Math.hypot(vx, vy);
    e.moving = vl > 5;
    if (e.mode === 'aim') { e.fx = e.dx; e.fy = e.dy; }
    else if (d0.ai !== 'turret') { if (vl > 5) { e.fx = vx / vl; e.fy = vy / vl; } else { e.fx = ux; e.fy = uy; } }
    // contacto
    if (!e.flying && d0.dmg > 0 && d0.ai !== 'turret' && d < p.r + e.r && e.atkCd <= 0) {
      const rad = (d0.rad || 0) + (e.irr ? C.irradiated.rad : 0);
      const r = hurtPlayer(s, e.dmg, { rad });
      if (r !== 0) { e.atkCd = C.player.contactCd; if (!e.boss) markAttack(s, e); }
    }
    if (!e.boss && d > C.spawn.relocate) { const q = ringPos(s, C.spawn.dist); e.x = q.x; e.y = q.y; }
  }
}

function updateEBullets(s, dt) {
  const p = s.p;
  for (const b of s.ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    if (dist2(b.x, b.y, p.x, p.y) < (p.r + b.r) ** 2) { b.dead = true; hurtPlayer(s, b.dmg, { rad: b.rad }); }
  }
  s.ebullets = s.ebullets.filter(b => !b.dead);
}

function updateTele(s, dt) {
  const p = s.p;
  for (const tl of s.tele) {
    tl.t += dt;
    if (tl.t >= tl.dur && !tl.done) {
      tl.done = true;
      s.booms.push({ x: tl.x, y: tl.y, r: tl.r, life: 0.25, max: 0.25, col: '255,90,60' });
      s.shake = Math.min(10, s.shake + 3);
      if (dist2(p.x, p.y, tl.x, tl.y) < (tl.r + p.r) ** 2) hurtPlayer(s, tl.dmg, {});
      if (tl.spawn) spawnEnemy(s, tl.spawn, tl.x, tl.y, { irr: false });
    }
  }
  s.tele = s.tele.filter(tl => !tl.done);
}

// ---------- armas ----------
function chain(s, first, jumps, dmg, src, ox, oy, skipFirst) {
  const J = CONFIG.weapons.tesla.jump;
  const seen = new Set([first.id]); const pts = [ox, oy, first.x, first.y];
  if (!skipFirst) hitEnemy(s, first, dmg, src, {});
  let cur = first;
  for (let j = 0; j < jumps; j++) {
    let best = null, bd = J * J;
    for (const e of queryNear(s, cur.x, cur.y, J)) { if (e.dead || seen.has(e.id)) continue; const dd = dist2(cur.x, cur.y, e.x, e.y); if (dd < bd) { bd = dd; best = e; } }
    if (!best) break;
    seen.add(best.id); pts.push(best.x, best.y);
    hitEnemy(s, best, dmg, src, {});
    cur = best;
  }
  if (s.beams.length < 60) s.beams.push({ pts, life: 0.12, col: '127,216,255' });
}

function updateWeapon(s, w, dt) {
  const C = CONFIG.weapons[w.id], st = s.st, p = s.p;
  switch (w.id) {
    case 'llave': case 'dinamo': {
      const n = w.id === 'llave' ? w.lvl : C.count;
      const dmg = w.id === 'llave' ? C.dmg * (1 + C.dmgPerLvl * (w.lvl - 1)) : C.dmg;
      const size = C.size * st.area;
      w.a += C.spin * dt;
      for (let i = 0; i < n; i++) {
        const an = w.a + i * TAU / n, x = p.x + Math.cos(an) * C.orbit, y = p.y + Math.sin(an) * C.orbit;
        const key = w.id + i;
        for (const e of queryNear(s, x, y, size)) {
          if (e.dead || e.flying) continue;
          const last = e.hits[key];
          if (last !== undefined && s.t - last < C.hitCd) continue;
          e.hits[key] = s.t;
          hitEnemy(s, e, dmg, w.id, { direct: true, melee: true, kb: 1, fx: p.x, fy: p.y });
          if (w.id === 'dinamo') chain(s, e, C.chainJumps, C.chainDmg, 'dinamo', e.x, e.y, true);
        }
      }
      break;
    }
    case 'pistola_clavos': case 'remachadora': {
      w.cd -= dt; if (w.cd > 0) break;
      const t = nearest(s, p.x, p.y, C.range);
      if (!t) { w.cd = 0.05; break; }
      const n = w.id === 'pistola_clavos' ? w.lvl : C.count;
      const base = Math.atan2(t.y - p.y, t.x - p.x);
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * C.spread;
        s.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * C.speed, vy: Math.sin(a) * C.speed, r: 4, life: C.range / C.speed, dmg: C.dmg, pierce: (C.pierce || 0) + st.pierce, src: w.id, direct: true, kb: 0.5, hit: [], col: C.color });
      }
      w.cd = (w.id === 'pistola_clavos' ? C.cd * Math.pow(C.cdPerLvl, w.lvl - 1) : C.cd) * st.cdMult;
      break;
    }
    case 'jeringa': {
      w.cd -= dt; if (w.cd > 0) break;
      const t = nearest(s, p.x, p.y, C.range);
      if (!t) { w.cd = 0.05; break; }
      const n = 2 + w.lvl, base = Math.atan2(t.y - p.y, t.x - p.x);
      for (let i = 0; i < n; i++) {
        const a = base + (i / (n - 1) - 0.5) * C.fan;
        s.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * C.speed, vy: Math.sin(a) * C.speed, r: 4, life: C.range / C.speed, dmg: C.dmg, pierce: st.pierce, src: 'jeringa', direct: true, kb: 0.3, hit: [], col: C.color });
      }
      w.cd = C.cd * st.cdMult;
      break;
    }
    case 'escopeta_chatarra': {
      w.cd -= dt; if (w.cd > 0) break;
      const t = nearest(s, p.x, p.y, C.range);
      if (!t) { w.cd = 0.05; break; }
      const n = C.pellets + C.pelletsPerLvl * (w.lvl - 1), base = Math.atan2(t.y - p.y, t.x - p.x);
      for (let i = 0; i < n; i++) {
        const a = base + (s.rng() - 0.5) * C.cone, sp = C.speed * (0.85 + s.rng() * 0.3);
        s.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3, life: C.life, dmg: C.dmg, pierce: st.pierce, src: 'escopeta_chatarra', direct: true, kb: 1.2, hit: [], col: C.color });
      }
      w.cd = C.cd * st.cdMult;
      break;
    }
    case 'coctel': {
      w.cd -= dt; if (w.cd > 0) break;
      const R2 = C.range * C.range;
      const cand = s.enemies.filter(e => !e.dead && !e.flying && dist2(e.x, e.y, p.x, p.y) < R2);
      if (!cand.length) { w.cd = 0.1; break; }
      for (let i = 0; i < w.lvl; i++) { const t = cand[(s.rng() * cand.length) | 0]; s.lobs.push({ sx: p.x, sy: p.y, tx: t.x, ty: t.y, t: 0, dur: C.flight, lvl: w.lvl }); }
      w.cd = C.cd * st.cdMult;
      break;
    }
    case 'tesla': {
      w.cd -= dt; if (w.cd > 0) break;
      const t = nearest(s, p.x, p.y, C.range);
      if (!t) { w.cd = 0.05; break; }
      chain(s, t, C.jumps + C.jumpsPerLvl * (w.lvl - 1), C.dmg * (1 + C.dmgPerLvl * (w.lvl - 1)), 'tesla', p.x, p.y, false);
      w.cd = C.cd * st.cdMult;
      break;
    }
    case 'geiger': {
      w.r = (C.r + C.rPerLvl * (w.lvl - 1) + C.rPerRad * p.rad) * st.area;
      w.cd -= dt; if (w.cd > 0) break;
      w.cd = C.tickCd;
      const dmg = C.dmg * (1 + C.dmgPerLvl * (w.lvl - 1));
      for (const e of queryNear(s, p.x, p.y, w.r)) hitEnemy(s, e, dmg, 'geiger', { kb: 0.15, fx: p.x, fy: p.y });
      break;
    }
    case 'martillo_pilon': {
      w.cd -= dt; if (w.cd > 0) break;
      const R = (C.r + C.rPerLvl * (w.lvl - 1)) * st.area;
      const hits = queryNear(s, p.x, p.y, R).filter(e => !e.flying);
      if (!hits.length) { w.cd = 0.05; break; }
      const dmg = C.dmg * (1 + C.dmgPerLvl * (w.lvl - 1));
      for (const e of hits) hitEnemy(s, e, dmg, 'martillo_pilon', { direct: true, melee: true, kb: C.kb, fx: p.x, fy: p.y });
      s.booms.push({ x: p.x, y: p.y, r: R, life: 0.2, max: 0.2, col: '232,163,58' });
      s.shake = Math.min(10, s.shake + 2);
      w.cd = C.cd * st.cdMult;
      break;
    }
    case 'petardos': {
      if (w.lx === undefined) { w.lx = p.x; w.ly = p.y; w.dist = 0; }
      w.dist += Math.hypot(p.x - w.lx, p.y - w.ly); w.lx = p.x; w.ly = p.y;
      const step = Math.max(20, (C.step + C.stepPerLvl * (w.lvl - 1)) * st.cdMult);
      while (w.dist >= step) {
        w.dist -= step;
        if (s.mines.length < 80) s.mines.push({ x: p.x, y: p.y, t: C.fuse, r: (C.r + C.rPerLvl * (w.lvl - 1)) * st.area, dmg: C.dmg * (1 + C.dmgPerLvl * (w.lvl - 1)), src: 'petardos' });
      }
      break;
    }
    case 'desfibrilador': {
      w.cd -= dt; if (w.cd > 0) break;
      const R2 = C.range * C.range;
      const cand = s.enemies.filter(e => !e.dead && dist2(e.x, e.y, p.x, p.y) < R2).sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
      if (!cand.length) { w.cd = 0.05; break; }
      const n = C.targets + w.lvl, dmg = C.dmg * (1 + C.dmgPerLvl * (w.lvl - 1)) * (1 + C.regenBonus * st.regen);
      for (const e of cand.slice(0, n)) {
        if (s.beams.length < 60) s.beams.push({ pts: [p.x, p.y, e.x, e.y], life: 0.1, col: '255,225,74' });
        hitEnemy(s, e, dmg, 'desfibrilador', { kb: C.kb, fx: p.x, fy: p.y });
      }
      w.cd = C.cd * st.cdMult;
      break;
    }
    case 'nucleo_cobalto': {
      w.cd -= dt; if (w.cd > 0) break;
      const t = nearest(s, p.x, p.y, C.speed * C.life);
      if (!t) { w.cd = 0.05; break; }
      const a = Math.atan2(t.y - p.y, t.x - p.x);
      const dmg = C.dmg * (1 + C.dmgPerLvl * (w.lvl - 1)) * (1 + C.radBonus * p.rad);
      s.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * C.speed, vy: Math.sin(a) * C.speed, r: C.size * st.area, life: C.life, dmg, pierce: C.pierce + w.lvl + st.pierce, src: 'nucleo_cobalto', direct: true, kb: 0.6, hit: [], col: C.color });
      w.cd = C.cd * st.cdMult;
      break;
    }
  }
}

function updateShots(s, dt) {
  for (const sh of s.shots) {
    if (sh.dead) continue;
    sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.life -= dt;
    if (sh.life <= 0) { sh.dead = true; continue; }
    for (const e of queryNear(s, sh.x, sh.y, sh.r)) {
      if (e.dead || sh.hit.includes(e.id)) continue;
      sh.hit.push(e.id);
      hitEnemy(s, e, sh.dmg, sh.src, { direct: sh.direct, kb: sh.kb, dx: sh.vx, dy: sh.vy });
      if (sh.pierce-- <= 0) { sh.dead = true; break; }
    }
  }
  s.shots = s.shots.filter(x => !x.dead);
}
function updateLobs(s, dt) {
  const C = CONFIG.weapons.coctel;
  for (const l of s.lobs) {
    l.t += dt;
    if (l.t >= l.dur) {
      l.dead = true;
      const life = C.dur + C.durPerLvl * (l.lvl - 1);
      s.pools.push({ x: l.tx, y: l.ty, r: C.poolR * s.st.area, life, max: life, tick: 0, dmg: C.dmg * (1 + C.dmgPerLvl * (l.lvl - 1)) });
    }
  }
  s.lobs = s.lobs.filter(l => !l.dead);
}
function updatePools(s, dt) {
  const C = CONFIG.weapons.coctel;
  for (const pl of s.pools) {
    pl.life -= dt; pl.tick -= dt;
    if (pl.tick <= 0) { pl.tick = C.poolTick; for (const e of queryNear(s, pl.x, pl.y, pl.r)) if (!e.flying) hitEnemy(s, e, pl.dmg, 'coctel', {}); }
  }
  s.pools = s.pools.filter(pl => pl.life > 0);
}
function updateMines(s, dt) {
  for (const m of s.mines) {
    m.t -= dt;
    if (m.t <= 0) {
      m.dead = true;
      for (const e of queryNear(s, m.x, m.y, m.r)) if (!e.flying) hitEnemy(s, e, m.dmg, m.src, { kb: 1, fx: m.x, fy: m.y });
      s.booms.push({ x: m.x, y: m.y, r: m.r, life: 0.18, max: 0.18, col: '255,90,90' });
    }
  }
  s.mines = s.mines.filter(m => !m.dead);
}

// ---------- recogida y XP ----------
function gainXp(s, v, raw) {
  s.xp += raw ? v : v * s.st.xpMult;
  while (s.xp >= s.xpNext) { s.xp -= s.xpNext; s.level++; s.xpNext = xpFor(s.level); s.pendingLevels++; }
  if (s.pendingLevels > 0 && !s.choice) openLevelChoice(s);
}
function updatePickups(s, dt) {
  const p = s.p, mag = s.st.magnet, C = CONFIG;
  for (const k of s.pickups) {
    if (k.dead) continue;
    const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1;
    if (k.kind === 'gem' || k.kind === 'stim') {
      if (!k.pull && d < mag) k.pull = true;
      if (k.pull) { k.sp = (k.sp || 250) + 900 * dt; const step = Math.min(d, k.sp * dt); k.x += dx / d * step; k.y += dy / d * step; }
    }
    if (d < p.r + k.r + 2) {
      k.dead = true;
      if (k.kind === 'gem') gainXp(s, k.val);
      else if (k.kind === 'stim') { s.cons.stim = Math.min(C.player.consMax, s.cons.stim + 1); textFx(s, p.x, p.y, '+Estimulante', '#fff', 12); }
      else if (k.kind === 'chest') openItemChoice(s);
      else if (k.kind === 'crate') {
        const S = C.events.supply;
        for (let i = 0; i < S.gems; i++) s.pickups.push({ kind: 'gem', val: S.gemValue, x: k.x + (s.rng() - 0.5) * 50, y: k.y + (s.rng() - 0.5) * 50, r: 5, pull: true, sp: 0 });
        const id = CONS_ORDER[(s.rng() * CONS_ORDER.length) | 0];
        s.cons[id] = Math.min(C.player.consMax, s.cons[id] + 1);
        textFx(s, p.x, p.y, '+' + C.consumables[id].name, '#fff', 13);
      }
    }
  }
  s.pickups = s.pickups.filter(k => !k.dead);
}

// ---------- director ----------
function currentWave(t) { let w = CONFIG.waves[0]; for (const x of CONFIG.waves) if (t >= x.from) w = x; return w; }
function bossAlive(s) { for (const e of s.enemies) if (e.boss && !e.dead) return true; return false; }
function fireEvent(s) {
  const E = CONFIG.events, M = CONFIG.run.mapSize, p = s.p;
  const kind = E.order[s.eventIdx++ % E.order.length];
  if (kind === 'supply') {
    const a = s.rng() * TAU;
    s.pickups.push({ kind: 'crate', x: clamp(p.x + Math.cos(a) * E.supply.dist, 60, M - 60), y: clamp(p.y + Math.sin(a) * E.supply.dist, 60, M - 60), r: 16 });
    banner(s, 'Caída de suministros');
  } else if (kind === 'swarm') {
    for (let i = 0; i < E.swarm.count; i++) { const a = i / E.swarm.count * TAU; spawnEnemy(s, E.swarm.type, clamp(p.x + Math.cos(a) * E.swarm.r, 10, M - 10), clamp(p.y + Math.sin(a) * E.swarm.r, 10, M - 10)); }
    banner(s, '¡Enjambre de drones!');
  } else {
    s.rain = E.rain.dur;
    banner(s, 'Lluvia radiactiva');
  }
}
function updateDirector(s, dt) {
  const C = CONFIG, w = currentWave(s.t);
  const rate = w.rate * (s.rain > 0 ? C.events.rain.spawnMult : 1) * (bossAlive(s) ? C.spawn.bossRateMult : 1);
  s.spawnAcc += rate * dt;
  let alive = 0; for (const e of s.enemies) if (!e.dead && !e.boss) alive++;
  const types = Object.keys(w.mix), weights = types.map(k => w.mix[k]);
  while (s.spawnAcc >= 1) {
    s.spawnAcc -= 1;
    if (alive >= w.max) { s.spawnAcc = 0; break; }
    const type = types[wpickIdx(s.rng, weights)];
    const d = C.enemies[type];
    const q = d.ai === 'turret' ? ringPos(s, (C.spawn.staticMin + C.spawn.staticMax) / 2, (C.spawn.staticMax - C.spawn.staticMin) / 2) : ringPos(s, C.spawn.dist);
    spawnEnemy(s, type, q.x, q.y);
    alive++;
  }
  if (s.t >= s.nextEvent) {
    if (s.t - s.lastBossAt < C.events.bossQuiet) s.nextEvent = s.lastBossAt + C.events.bossQuiet;
    else { fireEvent(s); s.nextEvent += C.events.every; }
  }
  if (s.rain > 0) s.rain -= dt;
  for (const k in C.bosses) if (!s.bossFlags[k] && s.t >= C.bosses[k].at) spawnBoss(s, k);
}

// ---------- cartas ----------
function ownedIds(s) { return new Set(s.weapons.map(w => w.id)); }
function weaponOptions(s) {
  const C = CONFIG, opts = [], owned = ownedIds(s), blocked = new Set();
  for (const f of C.fusions) if (owned.has(f.result)) { blocked.add(f.a); blocked.add(f.b); }
  for (const w of s.weapons) if (!C.weapons[w.id].fusion && w.lvl < 5) opts.push({ kind: 'up', id: w.id });
  if (s.weapons.length < C.player.weaponSlots)
    for (const id in C.weapons) {
      const W = C.weapons[id];
      if (W.fusion || owned.has(id) || blocked.has(id)) continue;
      if (W.owner && W.owner !== s.charId) continue;
      opts.push({ kind: 'new', id });
    }
  return opts;
}
function fusionOptions(s) {
  const out = [];

// ---------- dibujo ----------
let CAM = { x: 0, y: 0, k: 1 };   // cámara en coordenadas isométricas
const sx = (x, y) => (isoX(x, y) - CAM.x) * CAM.k + W / 2;
const sy = (x, y) => (isoY(x, y) - CAM.y) * CAM.k + H / 2;
function ellipse(x, y, r) { ctx.beginPath(); ctx.ellipse(sx(x, y), sy(x, y), r * CAM.k, r * CAM.k * 0.5, 0, 0, TAU); }
function circleS(px, py, r) { ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); }
function bar(x, y, w, h, f, col, label) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(f, 0, 1), h);
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  if (label) { ctx.fillStyle = '#fff'; ctx.font = `600 ${Math.max(9, h - 3)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + w / 2, y + h / 2 + 0.5); }
}
function animDur(id, anim, fallback) { const sh = Sprites.get(id, anim); return sh ? sh.meta.frames / sh.meta.fps : fallback; }
// Dibuja un sprite; devuelve false si no existe (para usar placeholder)
function drawSprite(id, anim, dir, time, loop, px, py, scale, alpha) {
  const sh = Sprites.get(id, anim); if (!sh) return false;
  const m = sh.meta, cw = m.cell[0], ch = m.cell[1];
  let f = Math.floor(Math.max(0, time) * m.fps);
  f = (loop && m.loop !== false) ? f % m.frames : Math.min(f, m.frames - 1);
  let row = dir;
  if (Array.isArray(m.directions)) { const name = DIRS[dir], i = m.directions.indexOf(name); row = i >= 0 ? i : (m.directions.indexOf(DIRS_ES[dir]) >= 0 ? m.directions.indexOf(DIRS_ES[dir]) : (m.directions.length === 1 ? 0 : dir)); }
  const s = scale * CAM.k;
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(sh.img, f * cw, row * ch, cw, ch, px - m.pivot[0] * s, py - m.pivot[1] * s, cw * s, ch * s);
  ctx.globalAlpha = 1;
  return true;
}
// Prueba varias animaciones en orden (p. ej. idle → move)
function drawAnyAnim(id, anims, dir, time, loop, px, py, scale, alpha) {
  for (const a of anims) if (drawSprite(id, a, dir, time, loop, px, py, scale, alpha)) return true;
  return false;
}
function placeholder(px, py, r, color, label, flash, alpha) {
  const R = r * CAM.k;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  circleS(px, py - R, R); ctx.fillStyle = flash ? '#fff' : color; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5; ctx.stroke();
  if (label && R > 4) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `600 ${clamp(R * 0.55, 8, 13)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, px, py - R * 2 - 7); }
  ctx.globalAlpha = 1;
}

function draw(s) {
  const C = CONFIG, p = s.p, M = C.run.mapSize, R = C.render;
  CAM.k = viewScale();
  CAM.x = isoX(p.x, p.y) + (Math.random() - 0.5) * s.shake / CAM.k;
  CAM.y = isoY(p.x, p.y) + (Math.random() - 0.5) * s.shake / CAM.k;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#16140f'; ctx.fillRect(0, 0, W, H);
  const onScreen = (x, y, m) => { const X = sx(x, y), Y = sy(x, y); return X > -m && X < W + m && Y > -m && Y < H + m; };

  // suelo (rombo del mapa) + rejilla
  ctx.beginPath(); ctx.moveTo(sx(0, 0), sy(0, 0)); ctx.lineTo(sx(M, 0), sy(M, 0)); ctx.lineTo(sx(M, M), sy(M, M)); ctx.lineTo(sx(0, M), sy(0, M)); ctx.closePath();
  ctx.fillStyle = '#2a261c'; ctx.fill(); ctx.strokeStyle = '#8a3324'; ctx.lineWidth = 4; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,200,.05)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let g = 100; g < M; g += 100) { ctx.moveTo(sx(g, 0), sy(g, 0)); ctx.lineTo(sx(g, M), sy(g, M)); ctx.moveTo(sx(0, g), sy(0, g)); ctx.lineTo(sx(M, g), sy(M, g)); }
  ctx.stroke();

  // capa de suelo
  for (const h of s.hazards) { if (!onScreen(h.x, h.y, h.r * CAM.k + 20)) continue; ellipse(h.x, h.y, h.r); ctx.fillStyle = 'rgba(110,220,60,.16)'; ctx.fill(); ctx.strokeStyle = 'rgba(110,220,60,.45)'; ctx.lineWidth = 2; ctx.stroke(); }
  for (const sl of s.slimes) { if (!onScreen(sl.x, sl.y, 60)) continue; ellipse(sl.x, sl.y, sl.r); ctx.fillStyle = `rgba(70,140,30,${0.35 * sl.life / sl.max})`; ctx.fill(); }
  for (const pl of s.pools) { if (!onScreen(pl.x, pl.y, 100)) continue; ellipse(pl.x, pl.y, pl.r); ctx.fillStyle = `rgba(255,120,30,${0.12 + 0.25 * pl.life / pl.max})`; ctx.fill(); }
  for (const tl of s.tele) {
    ellipse(tl.x, tl.y, tl.r); ctx.strokeStyle = 'rgba(255,60,40,.9)'; ctx.lineWidth = 3; ctx.stroke();
    ellipse(tl.x, tl.y, tl.r * Math.min(1, tl.t / tl.dur)); ctx.fillStyle = 'rgba(255,60,40,.28)'; ctx.fill();
  }
  for (const b of s.booms) { ellipse(b.x, b.y, b.r * (1.1 - 0.3 * b.life / b.max)); ctx.fillStyle = `rgba(${b.col},${0.45 * b.life / b.max})`; ctx.fill(); }
  for (const w of s.weapons) if (w.id === 'geiger' && w.r) { ellipse(p.x, p.y, w.r); ctx.fillStyle = 'rgba(125,255,106,.06)'; ctx.fill(); ctx.strokeStyle = 'rgba(125,255,106,.35)'; ctx.lineWidth = 2; ctx.stroke(); }
  ellipse(p.x, p.y, s.st.magnet); ctx.strokeStyle = 'rgba(95,176,255,.10)'; ctx.lineWidth = 1; ctx.stroke();
  for (const e of s.enemies) if (e.mode === 'aim') {
    const d = C.enemies[e.type], L = d.dashSpd * d.dash;
    ctx.strokeStyle = 'rgba(255,60,40,.85)'; ctx.lineWidth = e.boss ? 6 : 3; ctx.beginPath(); ctx.moveTo(sx(e.x, e.y), sy(e.x, e.y)); ctx.lineTo(sx(e.x + e.dx * L, e.y + e.dy * L), sy(e.x + e.dx * L, e.y + e.dy * L)); ctx.stroke();
  }
  // recogibles (planos sobre el suelo)
  for (const q of s.pickups) {
    if (!onScreen(q.x, q.y, 30)) continue;
    const X = sx(q.x, q.y), Y = sy(q.x, q.y), k = CAM.k;
    if (q.kind === 'gem') { const r = q.r * k * 1.2; ctx.fillStyle = q.val >= 25 ? '#ff8040' : q.val >= 5 ? '#e0c050' : '#8fb3c9'; ctx.beginPath(); ctx.moveTo(X, Y - r * 2); ctx.lineTo(X + r, Y - r); ctx.lineTo(X, Y); ctx.lineTo(X - r, Y - r); ctx.closePath(); ctx.fill(); }
    else if (q.kind === 'stim') { ctx.fillStyle = '#fff'; ctx.fillRect(X - 7 * k, Y - 14 * k, 14 * k, 14 * k); ctx.fillStyle = '#d33'; ctx.fillRect(X - 2 * k, Y - 12 * k, 4 * k, 10 * k); ctx.fillRect(X - 5 * k, Y - 9 * k, 10 * k, 4 * k); }
  }
  // sombras
  const shadow = (x, y, r) => { ellipse(x, y, r * 0.9); ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill(); };
  shadow(p.x, p.y, p.r);
  for (const e of s.enemies) if (onScreen(e.x, e.y, e.r * CAM.k * 3 + 40)) shadow(e.x, e.y, e.r);

  // actores ordenados por profundidad (x + y)
  const actors = [];
  for (const c of s.corpses) if (onScreen(c.x, c.y, 200)) actors.push({ k: 'corpse', o: c, d: c.x + c.y - 1000 });
  for (const e of s.enemies) if (!e.flying && onScreen(e.x, e.y, e.r * CAM.k * 4 + 60)) actors.push({ k: 'enemy', o: e, d: e.x + e.y });
  for (const q of s.pickups) if ((q.kind === 'chest' || q.kind === 'crate') && onScreen(q.x, q.y, 60)) actors.push({ k: 'box', o: q, d: q.x + q.y });
  for (const m of s.mines) actors.push({ k: 'mine', o: m, d: m.x + m.y });
  actors.push({ k: 'player', o: p, d: p.x + p.y });
  for (const w of s.weapons) {
    if (w.id !== 'llave' && w.id !== 'dinamo') continue;
    const W2 = C.weapons[w.id], n = w.id === 'llave' ? w.lvl : W2.count;
    for (let i = 0; i < n; i++) { const an = w.a + i * TAU / n; const x = p.x + Math.cos(an) * W2.orbit, y = p.y + Math.sin(an) * W2.orbit; actors.push({ k: 'wrench', o: { x, y, an, W2 }, d: x + y }); }
  }
  actors.sort((a, b) => a.d - b.d);
  for (const a of actors) drawActor(s, a);

  // proyectiles (a media altura)
  const zh = R.shotHeight * CAM.k;
  for (const l of s.lobs) { const f = l.t / l.dur, x = l.sx + (l.tx - l.sx) * f, y = l.sy + (l.ty - l.sy) * f; circleS(sx(x, y), sy(x, y) - zh - Math.sin(f * Math.PI) * 60 * CAM.k, 5 * CAM.k); ctx.fillStyle = '#ff8a2a'; ctx.fill(); }
  for (const sh of s.shots) { if (!onScreen(sh.x, sh.y, 20)) continue; circleS(sx(sh.x, sh.y), sy(sh.x, sh.y) - zh, Math.max(2, sh.r * CAM.k)); ctx.fillStyle = sh.col; ctx.fill(); }
  for (const b of s.ebullets) { if (!onScreen(b.x, b.y, 20)) continue; circleS(sx(b.x, b.y), sy(b.x, b.y) - zh, Math.max(2.5, b.r * CAM.k)); ctx.fillStyle = b.rad ? '#9dff4a' : '#ff4a3a'; ctx.fill(); }
  ctx.lineWidth = 2;
  for (const b of s.beams) {
    ctx.strokeStyle = `rgba(${b.col || '127,216,255'},.9)`; ctx.beginPath();
    for (let i = 0; i < b.pts.length; i += 2) { const X = sx(b.pts[i], b.pts[i + 1]) + (i ? (Math.random() - 0.5) * 6 : 0), Y = sy(b.pts[i], b.pts[i + 1]) - zh + (i ? (Math.random() - 0.5) * 6 : 0); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
    ctx.stroke();
  }
  // voladores (dirigible) por encima de todo
  for (const e of s.enemies) if (e.flying) { shadow(e.x, e.y, e.r * 1.4); drawActor(s, { k: 'enemy', o: e }); }
  // textos
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of s.texts) { ctx.globalAlpha = clamp(t.life / 0.5, 0, 1); ctx.font = `700 ${t.size}px system-ui`; ctx.fillStyle = t.col; ctx.fillText(t.txt, sx(t.x, t.y), sy(t.x, t.y) - 50 * CAM.k - (0.8 - t.life) * 50); }
  ctx.globalAlpha = 1;
  drawHud(s);
}

function drawActor(s, a) {
  const C = CONFIG, R = C.render, o = a.o, t = s.t;
  if (a.k === 'player') {
    const ch = C.characters[s.charId], scale = ch.size * R.scalePerSize.characters;
    const X = sx(o.x, o.y), Y = sy(o.x, o.y), dir = dirIndex(o.fx, o.fy);
    let anim, at, loop = true;
    if (o.deadAt >= 0) { anim = ['death']; at = t - o.deadAt; loop = false; }
    else if (t - o.lastHit < animDur(s.charId, 'hit', R.fallbackHitDur) && (R.hitWhileMoving || !o.moving)) { anim = ['hit', 'idle']; at = t - o.lastHit; loop = false; }
    else if (o.moving) { anim = ['run']; at = t; }
    else { anim = ['idle', 'run']; at = t; }
    const blink = o.inv > 0 && o.deadAt < 0 && Math.floor(t * 20) % 2;
    if (!drawAnyAnim(s.charId, anim, dir, at, loop, X, Y, scale, blink ? 0.45 : 1)) {
      placeholder(X, Y, o.r * 1.3, ch.color, s.charId, o.hurt > 0, blink ? 0.45 : 1);
      // marca de orientación
      const fx = sx(o.x + o.fx * 22, o.y + o.fy * 22), fy = sy(o.x + o.fx * 22, o.y + o.fy * 22);
      ctx.strokeStyle = o.turbo > 0 ? '#ff4ad0' : '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X, Y - o.r * 1.3 * CAM.k); ctx.lineTo(fx, fy - o.r * 1.3 * CAM.k); ctx.stroke();
    }
    return;
  }
  if (a.k === 'enemy') {
    const e = o, d = C.enemies[e.type], id = spriteIdFor(e), cat = d.cat;
    const scale = d.size * R.scalePerSize[cat];
    const lift = e.flying ? R.flyHeight * CAM.k : 0;
    const X = sx(e.x, e.y), Y = sy(e.x, e.y) - lift, dir = dirIndex(e.fx, e.fy);
    const atkDur = animDur(id, e.atkAnim, R.fallbackAttackDur);
    let anims, at = t - e.born, loop = true;
    if (t - e.lastAtk < atkDur) { anims = [e.atkAnim, 'attack', 'move']; at = t - e.lastAtk; loop = false; }
    else if (d.ai === 'turret' || !e.moving) anims = ['idle', 'move'];
    else anims = ['move', 'idle'];
    if (!drawAnyAnim(id, anims, dir, at, loop, X, Y, scale) && !(id !== e.type && drawAnyAnim(e.type, anims, dir, at, loop, X, Y, scale))) {
      placeholder(X, Y, e.r, d.color, id, e.flash > 0);
    }
    if (e.irr) { ctx.strokeStyle = 'rgba(125,255,60,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(X, Y, e.r * CAM.k * 1.1, e.r * CAM.k * 0.55, 0, 0, TAU); ctx.stroke(); }
    if (e.flash > 0 && Sprites.get(id, 'move')) { ctx.fillStyle = 'rgba(255,255,255,.35)'; circleS(X, Y - e.r * CAM.k, e.r * CAM.k); ctx.fill(); }
    if (!e.boss && e.hp < e.maxHp) { const w = Math.max(16, e.r * 2 * CAM.k), top = Y - e.r * 2.6 * CAM.k - 8; ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(X - w / 2, top, w, 3); ctx.fillStyle = '#e55'; ctx.fillRect(X - w / 2, top, w * e.hp / e.maxHp, 3); }
    return;
  }
  if (a.k === 'corpse') {
    const c = o, d = C.enemies[c.type], at = t - c.t, life = R.corpseTime;
    const fade = clamp((life - at) / 0.6, 0, 1);
    const lift = c.flying ? Math.max(0, R.flyHeight * (1 - at / 1.2)) * CAM.k : 0;
    const X = sx(c.x, c.y), Y = sy(c.x, c.y) - lift;
    if (!drawAnyAnim(c.id, ['death'], dirIndex(c.fx, c.fy), at, false, X, Y, d.size * R.scalePerSize[d.cat], fade) &&
        !drawAnyAnim(c.type, ['death'], dirIndex(c.fx, c.fy), at, false, X, Y, d.size * R.scalePerSize[d.cat], fade)) {
      if (at < 0.5) { ctx.globalAlpha = 0.5 * (1 - at / 0.5); ctx.beginPath(); ctx.ellipse(X, Y, c.r * CAM.k, c.r * CAM.k * 0.5, 0, 0, TAU); ctx.fillStyle = d.color; ctx.fill(); ctx.globalAlpha = 1; }
    }
    return;
  }
  if (a.k === 'box') {
    const q = o, X = sx(q.x, q.y), Y = sy(q.x, q.y), k = CAM.k;
    ctx.fillStyle = q.kind === 'chest' ? '#8a5a2a' : '#5a6a3a'; ctx.fillRect(X - 14 * k, Y - 22 * k, 28 * k, 22 * k);
    ctx.strokeStyle = q.kind === 'chest' ? '#ffd34a' : '#e8d070'; ctx.lineWidth = 2; ctx.strokeRect(X - 14 * k, Y - 22 * k, 28 * k, 22 * k);
    return;
  }
  if (a.k === 'mine') { circleS(sx(o.x, o.y), sy(o.x, o.y) - 4 * CAM.k, 4 * CAM.k); ctx.fillStyle = Math.floor(o.t * 12) % 2 ? '#ff5a5a' : '#fff'; ctx.fill(); return; }
  if (a.k === 'wrench') {
    const X = sx(o.x, o.y), Y = sy(o.x, o.y) - R.shotHeight * CAM.k, sz = o.W2.size * s.st.area * CAM.k;
    ctx.save(); ctx.translate(X, Y); ctx.rotate(o.an * 2); ctx.fillStyle = o.W2.color; ctx.fillRect(-sz, -sz * 0.45, sz * 2, sz * 0.9); ctx.restore();
  }
}

function drawHud(s) {
  const C = CONFIG, p = s.p;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (s.rain > 0) { ctx.fillStyle = 'rgba(120,255,60,.07)'; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = 'rgba(160,255,100,.25)'; ctx.lineWidth = 1; ctx.beginPath(); for (let i = 0; i < 60; i++) { const x = (i * 97 + s.t * 300) % W, y = (i * 53 + s.t * 700) % H; ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14); } ctx.stroke(); }
  if (s.storm) { ctx.fillStyle = `rgba(160,40,20,${0.15 + 0.1 * Math.sin(s.t * 6)})`; ctx.fillRect(0, 0, W, H); }
  if (p.hurt > 0) { ctx.fillStyle = 'rgba(255,0,0,.15)'; ctx.fillRect(0, 0, W, H); }
  // indicadores fuera de pantalla
  const targets = [];
  for (const q of s.pickups) if (q.kind === 'crate' || q.kind === 'chest') targets.push([q.x, q.y, '#ffd34a']);
  for (const e of s.enemies) if (e.boss) targets.push([e.x, e.y, '#ff5040']);
  for (const [tx, ty, col] of targets) {
    const X = sx(tx, ty), Y = sy(tx, ty);
    if (X > 0 && X < W && Y > 0 && Y < H) continue;
    const a = Math.atan2(Y - H / 2, X - W / 2), m = 30;
    const ex = clamp(X, m, W - m), ey = clamp(Y, m + 30, H - m - 60);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, 6); ctx.fillStyle = '#5fb0ff'; ctx.fillRect(0, 0, W * s.xp / s.xpNext, 6);
  bar(10, 12, 170, 15, p.hp / p.maxHp, '#d94a3a', `${Math.ceil(p.hp)} / ${p.maxHp}`);
  const tier = radTier(p.rad);
  bar(10, 30, 170, 11, p.rad / 100, tier.color, `RAD ${Math.floor(p.rad)}`);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#efe6cf'; ctx.font = '700 14px system-ui';
  ctx.fillText('Nv ' + s.level, 188, 20);
  if (p.turbo > 0) { ctx.fillStyle = '#ff4ad0'; ctx.fillText('TURBO ' + p.turbo.toFixed(1), 188, 36); }
  ctx.textAlign = 'center'; ctx.font = '700 22px system-ui'; ctx.fillStyle = s.storm ? '#ff6040' : '#efe6cf';
  ctx.fillText(fmtTime(s.t), W / 2, 24);
  ctx.font = '600 12px system-ui'; ctx.fillStyle = '#a39a82'; ctx.fillText('☠ ' + s.kills, W / 2, 44);
  const boss = s.enemies.find(e => e.boss);
  if (boss) { const bw = Math.min(360, W - 40); bar(W / 2 - bw / 2, 54, bw, 12, boss.hp / boss.maxHp, '#c03a2a', C.enemies[boss.type].name + (boss.type === 'coloso' ? ' · F' + boss.phase : '')); }
  ctx.textAlign = 'left'; ctx.font = '600 12px system-ui';
  s.weapons.forEach((w, i) => { const W2 = C.weapons[w.id]; ctx.fillStyle = W2.color; ctx.fillText(`${W2.short} ${W2.fusion ? 'MAX' : 'Nv' + w.lvl}`, 10, H - 14 - (s.weapons.length - 1 - i) * 16 - (s.item ? 16 : 0)); });
  if (s.item) { ctx.fillStyle = '#5fb0ff'; ctx.fillText('◆ ' + C.items[s.item].name, 10, H - 14); }
  if (s.banners.length) { const b = s.banners[s.banners.length - 1]; ctx.globalAlpha = clamp(b.life, 0, 1); ctx.textAlign = 'center'; ctx.font = '800 20px system-ui'; ctx.fillStyle = '#ffd34a'; ctx.fillText(b.text, W / 2, boss ? 90 : 76); ctx.globalAlpha = 1; }
  if (joy.active) {
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; circleS(joy.ox, joy.oy, 55); ctx.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), f = l > 55 ? 55 / l : 1;
    ctx.fillStyle = 'rgba(255,255,255,.3)'; circleS(joy.ox + dx * f, joy.oy + dy * f, 20); ctx.fill();
  }
}

// ---------- bucle ----------
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (dt > 0) fps = fps * 0.95 + (1 / dt) * 0.05;
  if (S) {
    const blocked = S.over || S.choice || S.paused || portraitBlock();
    if (!blocked) {
      acc += dt * gameSpeed; const inp = readInput();
      let guard = 0;
      while (acc >= STEP && guard++ < 16 * gameSpeed) { tick(S, STEP, inp); acc -= STEP; if (S.choice || S.over) { acc = 0; break; } }
      if (acc > STEP * 4) acc = 0;
    } else acc = 0;
    if (S.choice && shownChoice !== S.choice) renderChoice();
    if (S.over && !shownOver) {
      // deja ver la animación de muerte antes del ticket
      overSeen += dt;
      if (S.won || S.p.deadAt < 0 || overSeen > 1.4) renderResults();
    }
    syncCons();
    if (dbgOn) { dbgTimer -= dt; if (dbgTimer <= 0) { dbgTimer = 0.25; syncDbg(); } }
    draw(S);
  } else {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#14120d'; ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}
window.AA = { CONFIG, Sprites, createGame, tick, applyChoice, useConsumable, results, get S() { return S; } };
renderMenu();
Sprites.loadManifest().then(n => { const el = document.getElementById('assetStatus'); if (el) el.textContent = `Sprites cargados: ${Sprites.count()}`; });
requestAnimationFrame(frame);
</script>
